# Builds the Android app for the AYN Thor and publishes it as a release. The release tag is the
# app's version name, so Obtainium (Forgejo/Codeberg source) can install and update it.
#
# - Pushes to thor (the default branch) build that commit.
# - Every night, master is fast-forwarded to upstream master, so that it stays a pure mirror of
#   upstream, and then merged into thor. If upstream moved, the result is pushed and built. A
#   merge conflict is reported as an issue.
# - Running the workflow by hand does the same, but always builds.
# - Each new release's tag is pushed to the repos in DOWNSTREAM, which starts their builds.
#
# The build runs in a container on the runner host's Docker daemon, with a persistent volume
# holding the checkout and caches (see .gitea/thor).
name: Thor APK

on:
  push:
    branches: [thor]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

env:
  BUILDER_IMAGE: dolphin-thor-builder:latest
  WORK_VOLUME: dolphin-thor-work
  KEEP_RELEASES: "20"
  # Repos that rebuild each release, told about it by "Trigger downstream builds".
  DOWNSTREAM: cruxial.org/dolphin-handheld
  # git.cruxial.org's SSH host key, so the push can check it's talking to our Gitea.
  GIT_HOST_KEY: git.cruxial.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJIjwddcQyswHrcIXIUrJ1NJuvDLnka9ToPePIoEQWz5

jobs:
  apk:
    runs-on: linux
    steps:
      - name: Build builder image
        run: |
          ctx=$(mktemp -d)
          for f in Dockerfile ci.sh; do
            curl -fsSL -o "$ctx/$f" \
              "${{ gitea.server_url }}/${{ gitea.repository }}/raw/commit/${{ gitea.sha }}/.gitea/thor/$f"
          done
          chmod +x "$ctx/ci.sh"
          docker build -q -t "$BUILDER_IMAGE" "$ctx"
          rm -rf "$ctx"

      - name: Build APK
        id: build
        env:
          GIT_TOKEN: ${{ gitea.token }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          MODE: ${{ gitea.event_name == 'push' && 'build' || 'sync' }}
          SYNC_BUILD_UNCHANGED: ${{ gitea.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          name="thor-ci-${{ gitea.run_id }}"
          docker volume create "$WORK_VOLUME" > /dev/null
          set +e
          # Leave a couple of cores and some memory to everything else on the host.
          docker run --name "$name" --cpuset-cpus 0-11 --memory 12g \
            -v "$WORK_VOLUME:/work" \
            -e ORIGIN_URL="${{ gitea.server_url }}/${{ gitea.repository }}.git" \
            -e BRANCH=thor -e SHA="${{ gitea.sha }}" \
            -e MODE -e SYNC_BUILD_UNCHANGED -e GIT_TOKEN -e KEYSTORE_B64 \
            "$BUILDER_IMAGE"
          status=$?
          set -e
          rm -rf out
          docker cp "$name:/out" out || mkdir out
          docker rm "$name" > /dev/null
          touch out/info.env
          cat out/info.env
          cat out/info.env >> "$GITHUB_OUTPUT"
          exit $status

      - name: Publish release
        id: release
        if: steps.build.outputs.APK != ''
        env:
          TOKEN: ${{ gitea.token }}
          TAG: ${{ steps.build.outputs.TAG }}
          SHA: ${{ steps.build.outputs.SHA }}
          APK: ${{ steps.build.outputs.APK }}
          VERSION_NAME: ${{ steps.build.outputs.VERSION_NAME }}
        run: |
          api="${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}"
          auth="Authorization: token $TOKEN"

          if existing=$(curl -fsS -H "$auth" "$api/releases/tags/$TAG" 2>/dev/null); then
            echo "$TAG was already released."
            echo "url=$(jq -r .html_url <<< "$existing")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          body=$(jq -n --arg tag "$TAG" --arg sha "$SHA" --arg name "Dolphin Thor $VERSION_NAME" \
            --rawfile notes out/notes.md \
            '{tag_name: $tag, target_commitish: $sha, name: $name, body: $notes}')
          release=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$body" "$api/releases")
          id=$(jq -r .id <<< "$release")
          curl -fsS -X POST -H "$auth" -F "attachment=@out/$APK" \
            "$api/releases/$id/assets?name=$APK" > /dev/null
          echo "url=$(jq -r .html_url <<< "$release")" >> "$GITHUB_OUTPUT"

          # Keep only the newest releases (and their tags) made by this workflow.
          curl -fsS -H "$auth" "$api/releases?limit=50" |
            jq -r '[.[] | select(.name | startswith("Dolphin Thor "))] | .['"$KEEP_RELEASES"':][] | "\(.id) \(.tag_name)"' |
            while read -r old_id old_tag; do
              curl -fsS -X DELETE -H "$auth" "$api/releases/$old_id" > /dev/null
              curl -fsS -X DELETE -H "$auth" "$api/tags/$old_tag" > /dev/null
            done

      # Tells downstream repos about a new release by pushing its tag to them, which starts their
      # workflows (dolphin-handheld rebuilds it as org.dolphinemu.handheld). They hold the public
      # half of the org secret DEPLOY_KEY as a write deploy key. Without the secret they still
      # find the release on their own schedule.
      - name: Trigger downstream builds
        if: steps.release.outputs.url != ''
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          TAG: ${{ steps.build.outputs.TAG }}
        run: |
          set -e
          if [ -z "$DEPLOY_KEY" ]; then
            echo "DEPLOY_KEY is not set; downstream repos will pick the release up themselves."
            exit 0
          fi
          command -v ssh > /dev/null || { apt-get update -qq && apt-get install -y -qq openssh-client > /dev/null; }
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$dir/key")
          echo "$GIT_HOST_KEY" > "$dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$dir/known_hosts -o StrictHostKeyChecking=yes"
          for repo in $DOWNSTREAM; do
            url="git@git.cruxial.org:$repo.git"
            if git ls-remote --exit-code --tags "$url" "refs/tags/$TAG" > /dev/null; then
              echo "$repo already has $TAG."
              continue
            fi
            git init -q "$dir/repo"
            git -C "$dir/repo" fetch -q --depth 1 "$url" main
            git -C "$dir/repo" push -q "$url" "FETCH_HEAD:refs/tags/$TAG"
            rm -rf "$dir/repo"
            echo "Pushed $TAG to $repo."
          done

      - name: Report merge conflict
        if: failure() && steps.build.outputs.SYNC == 'conflict'
        env:
          TOKEN: ${{ gitea.token }}
        run: |
          api="${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}"
          body=$(jq -n --rawfile text out/conflict.md \
            '{title: "Thor: merging upstream needs help", body: $text}')
          curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "$body" "$api/issues" > /dev/null

      - name: Notify
        if: always() && (failure() || steps.release.outputs.url != '')
        uses: https://git.cruxial.org/cruxial.org/actions/.gitea/actions/notify@main
        with:
          status: ${{ job.status }}
          pass_message: "New Dolphin Thor build: ${{ steps.release.outputs.url }}"
          fail_message: ${{ steps.build.outputs.SYNC == 'conflict' && 'Upstream Dolphin changes conflict with thor; an issue was opened.' || 'Dolphin Thor build failed - check logs' }}
