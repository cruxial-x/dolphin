# Builds the Android app for the AYN Thor and publishes it as a release. The release tag is the
# app's version name, so Obtainium (Forgejo/Codeberg source) can install and update it.
#
# - Pushes to thor (the default branch) build that commit.
# - Every night, master is fast-forwarded to upstream master, so that it stays a pure mirror of
#   upstream, and then merged into thor. If upstream moved, the result is pushed and built. A
#   merge conflict is reported as an issue.
# - Running the workflow by hand does the same, but always builds.
# - Each build is also pushed to MIRROR_REPO on GitHub and released there under the same tag.
# - Pull requests into thor get a test build of their head commit: "Dolphin Thor Dev", a separate
#   app signed with the Android debug key, published here as a prerelease and never on GitHub.
#
# The build runs in a container on the runner host's Docker daemon, with a persistent volume
# holding the checkout and caches (see .gitea/thor).
name: Thor APK

on:
  push:
    branches: [thor]
  pull_request:
    branches: [thor]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

env:
  BUILDER_IMAGE: dolphin-thor-builder:latest
  WORK_VOLUME: dolphin-thor-work
  KEEP_RELEASES: "20"
  KEEP_DEV_RELEASES: "5"
  DEV: ${{ gitea.event_name == 'pull_request' }}
  BUILD_SHA: ${{ gitea.event.pull_request.head.sha || gitea.sha }}
  # The public copy on GitHub: the code is pushed there and each release is published there too.
  MIRROR_REPO: cruxial-x/dolphin

jobs:
  apk:
    runs-on: linux
    steps:
      - name: Build builder image
        run: |
          ctx=$(mktemp -d)
          for f in Dockerfile ci.sh; do
            curl -fsSL -o "$ctx/$f" \
              "${{ gitea.server_url }}/${{ gitea.repository }}/raw/commit/$BUILD_SHA/.gitea/thor/$f"
          done
          chmod +x "$ctx/ci.sh"
          docker build -q -t "$BUILDER_IMAGE" "$ctx"
          rm -rf "$ctx"

      - name: Build APK
        id: build
        env:
          GIT_TOKEN: ${{ gitea.token }}
          # Test builds never see the release key or the mirror's token.
          KEYSTORE_B64: ${{ gitea.event_name == 'pull_request' && secrets.KEYSTORE_B64 || secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ gitea.event_name == 'pull_request' && 'android' || secrets.RELEASE_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ gitea.event_name == 'pull_request' && 'androiddebugkey' || 'release' }}
          MIRROR_TOKEN: ${{ gitea.event_name != 'pull_request' && secrets.GH_MIRROR_TOKEN || '' }}
          MODE: ${{ gitea.event_name == 'push' && 'build' || gitea.event_name == 'pull_request' && 'dev' || 'sync' }}
          PR: ${{ gitea.event.pull_request.number }}
          SYNC_BUILD_UNCHANGED: ${{ gitea.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          name="thor-ci-${{ gitea.run_id }}"
          docker volume create "$WORK_VOLUME" > /dev/null
          mirror_url="https://github.com/$MIRROR_REPO.git"
          if [ "$MODE" = dev ]; then mirror_url=; fi
          set +e
          # Leave a couple of cores and some memory to everything else on the host.
          docker run --name "$name" --cpuset-cpus 0-11 --memory 12g \
            -v "$WORK_VOLUME:/work" \
            -e ORIGIN_URL="${{ gitea.server_url }}/${{ gitea.repository }}.git" \
            -e BRANCH=thor -e SHA="$BUILD_SHA" -e PR \
            -e MODE -e SYNC_BUILD_UNCHANGED -e GIT_TOKEN \
            -e KEYSTORE_B64 -e KEYSTORE_PASS -e KEY_ALIAS \
            -e MIRROR_URL="$mirror_url" -e MIRROR_TOKEN \
            "$BUILDER_IMAGE"
          status=$?
          set -e
          rm -rf out
          docker cp "$name:/out" out || mkdir out
          docker rm "$name" > /dev/null
          touch out/info.env
          cat out/info.env
          cat out/info.env >> "$GITHUB_OUTPUT"
          exit $status

      - name: Publish release
        id: release
        if: steps.build.outputs.APK != ''
        env:
          TOKEN: ${{ gitea.token }}
          TAG: ${{ steps.build.outputs.TAG }}
          SHA: ${{ steps.build.outputs.SHA }}
          APK: ${{ steps.build.outputs.APK }}
          VERSION_NAME: ${{ steps.build.outputs.VERSION_NAME }}
        run: |
          api="${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}"
          auth="Authorization: token $TOKEN"

          if existing=$(curl -fsS -H "$auth" "$api/releases/tags/$TAG" 2>/dev/null); then
            echo "$TAG was already released."
            echo "url=$(jq -r .html_url <<< "$existing")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Test builds are prereleases with their own name, so that they are pruned separately
          # and aren't offered as the latest release.
          prefix="Dolphin Thor"
          keep=$KEEP_RELEASES
          if [ "$DEV" = true ]; then
            prefix="Dev build"
            keep=$KEEP_DEV_RELEASES
          fi

          body=$(jq -n --arg tag "$TAG" --arg sha "$SHA" --arg name "$prefix $VERSION_NAME" \
            --argjson dev "$DEV" --rawfile notes out/notes.md \
            '{tag_name: $tag, target_commitish: $sha, name: $name, body: $notes, prerelease: $dev}')
          release=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$body" "$api/releases")
          id=$(jq -r .id <<< "$release")
          curl -fsS -X POST -H "$auth" -F "attachment=@out/$APK" \
            "$api/releases/$id/assets?name=$APK" > /dev/null
          echo "url=$(jq -r .html_url <<< "$release")" >> "$GITHUB_OUTPUT"

          # Keep only the newest releases (and their tags) of this kind made by this workflow.
          curl -fsS -H "$auth" "$api/releases?limit=50" |
            jq -r --arg prefix "$prefix " --argjson keep "$keep" \
              '[.[] | select(.name | startswith($prefix))] | .[$keep:][] | "\(.id) \(.tag_name)"' |
            while read -r old_id old_tag; do
              curl -fsS -X DELETE -H "$auth" "$api/releases/$old_id" > /dev/null
              curl -fsS -X DELETE -H "$auth" "$api/tags/$old_tag" > /dev/null
            done

      - name: Publish release on GitHub
        if: steps.build.outputs.APK != '' && gitea.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          MIRROR: ${{ steps.build.outputs.MIRROR }}
          TAG: ${{ steps.build.outputs.TAG }}
          SHA: ${{ steps.build.outputs.SHA }}
          APK: ${{ steps.build.outputs.APK }}
          VERSION_NAME: ${{ steps.build.outputs.VERSION_NAME }}
        run: |
          if [ "$MIRROR" != pushed ]; then
            echo "The push to $MIRROR_REPO failed (see the end of the build step)." >&2
            exit 1
          fi
          api="https://api.github.com/repos/$MIRROR_REPO"
          auth="Authorization: Bearer $TOKEN"

          if curl -fsS -o /dev/null -H "$auth" "$api/releases/tags/$TAG" 2>/dev/null; then
            echo "$TAG was already released."
            exit 0
          fi

          body=$(jq -n --arg tag "$TAG" --arg sha "$SHA" --arg name "Dolphin Thor $VERSION_NAME" \
            --rawfile notes out/notes.md \
            '{tag_name: $tag, target_commitish: $sha, name: $name, body: $notes}')
          release=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$body" "$api/releases")
          id=$(jq -r .id <<< "$release")
          curl -fsS -X POST -H "$auth" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@out/$APK" \
            "https://uploads.github.com/repos/$MIRROR_REPO/releases/$id/assets?name=$APK" > /dev/null
          jq -r .html_url <<< "$release"

          curl -fsS -H "$auth" "$api/releases?per_page=100" |
            jq -r '[.[] | select(.name | startswith("Dolphin Thor "))] | .['"$KEEP_RELEASES"':][] | "\(.id) \(.tag_name)"' |
            while read -r old_id old_tag; do
              curl -fsS -X DELETE -H "$auth" "$api/releases/$old_id" > /dev/null
              curl -fsS -X DELETE -H "$auth" "$api/git/refs/tags/$old_tag" > /dev/null
            done

      - name: Report merge conflict
        if: failure() && steps.build.outputs.SYNC == 'conflict'
        env:
          TOKEN: ${{ gitea.token }}
        run: |
          api="${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}"
          body=$(jq -n --rawfile text out/conflict.md \
            '{title: "Thor: merging upstream needs help", body: $text}')
          curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "$body" "$api/issues" > /dev/null

      - name: Notify
        if: always() && (failure() || steps.release.outputs.url != '')
        uses: https://git.cruxial.org/cruxial.org/actions/.gitea/actions/notify@main
        with:
          status: ${{ job.status }}
          pass_message: "New Dolphin Thor ${{ gitea.event_name == 'pull_request' && 'test ' || '' }}build: ${{ steps.release.outputs.url }}"
          fail_message: ${{ steps.build.outputs.SYNC == 'conflict' && 'Upstream Dolphin changes conflict with thor; an issue was opened.' || steps.release.outputs.url != '' && 'Dolphin Thor was released here, but publishing it on GitHub failed - check logs' || 'Dolphin Thor build failed - check logs' }}
