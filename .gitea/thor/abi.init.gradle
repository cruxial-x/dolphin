// Only build the native code for the ABI the AYN Thor uses. Unlike -Pandroid.injected.build.abi,
// this doesn't mark the APK as test-only, so it can be installed without adb.
//
// Also replaces the "-debug" version name suffix with THOR_VERSION_SUFFIX, so that the version
// name matches the release tag, which is what Obtainium compares to detect updates.
def versionSuffix = System.getenv('THOR_VERSION_SUFFIX')

allprojects {
    pluginManager.withPlugin('com.android.application') {
        androidComponents.finalizeDsl { android ->
            android.defaultConfig.ndk.abiFilters.retainAll(['arm64-v8a'])
            if (versionSuffix)
                android.buildTypes.getByName('debug').versionNameSuffix = versionSuffix
        }
    }
}
